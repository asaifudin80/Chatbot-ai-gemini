<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot AI - Gemini</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>🤖 As AI</h1>
      <p>Powered by Google Gemini API</p>
    </header>

    <main id="chat-box" class="chat-box"></main>

    <form id="chat-form" class="chat-input">
      <input type="text,image,file" id="user-input" placeholder="Ketik pesanmu di sini..." autocomplete="off" required />
      <button type="submit" id="send-btn">Kirim ➤</button>
    </form>
  </div>

  <!-- Modal pengaturan API Key -->
  <div id="api-modal" class="modal">
    <div class="modal-content">
      <h2>⚙️ Pengaturan API</h2>
      <p>Masukkan Gemini API Key (gratis di
        <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>).
        Key disimpan di browser kamu, tidak dikirim ke mana pun:</p>
      <input type="password" id="api-key-input" placeholder="AIza..." />
      <select id="model-select">
        <option value="gemini-3.5-flash">gemini-3.5-flash (cepat & gratis)</option>
  
      </select>
      <div class="modal-actions">
        <button id="save-api-btn">💾 Simpan</button>
        <button id="close-modal-btn" class="secondary">Tutup</button>
      </div>
    </div>
  </div>

  <button id="settings-btn" title="Pengaturan API">⚙️</button>

  <script src="script.js"></script>
</body>
</html>
