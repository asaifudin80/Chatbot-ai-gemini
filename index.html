<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot AI - Gemini</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>🤖 As AI</h1>
      <p>Powered by Google Gemini API</p>
    </header>
    <main id="chat-box" class="chat-box"></main>
    <form id="chat-form" class="chat-input">
      <input type="text" id="user-input" placeholder="Ketik pesanmu di sini..." autocomplete="off" required />
      <button type="submit" id="send-btn">Kirim ➤</button>
    </form>
  </div>

  <!-- Modal pengaturan API Key -->
  <div id="api-modal" class="modal">
    <div class="modal-content">
      <h2>⚙️ Pengaturan API</h2>
      <p>Masukkan Gemini API Key (gratis di <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com</a>). Bisa isi 3 key biar auto ganti kalau limit:</p>

      <label>API Key 1 (wajib):</label>
      <input type="password" id="api-key-1" placeholder="AIza...">

      <label>API Key 2 (opsional):</label>
      <input type="password" id="api-key-2" placeholder="AIza... (cadangan)">

      <label>API Key 3 (opsional):</label>
      <input type="password" id="api-key-3" placeholder="AIza... (cadangan)">

      <label style="margin-top:10px">Pilih Key Aktif:</label>
      <select id="api-key-select">
        <option value="0">Gunakan Key 1</option>
        <option value="1">Gunakan Key 2</option>
        <option value="2">Gunakan Key 3</option>
        <option value="auto">🔄 Auto-Rotasi (Anti Limit 20)</option>
      </select>

      <label style="margin-top:10px">Pilih Model (biar gak limit):</label>
      <select id="model-select">
        <option value="gemini-2.0-flash-lite">gemini-3.5-flash (GRATIS 1500/hari - REKOMENDED)</option>
        <option value="gemini-2.0-flash">gemini-3.0-flash (GRATIS 1500/hari)</option>
        <option value="gemini-1.5-flash">gemini-2.0-flash-lite (GRATIS 1500/hari)</option>
      </select>

      <div class="modal-actions">
        <button id="save-api-btn">💾 Simpan</button>
        <button id="close-modal-btn" class="secondary">Tutup</button>
      </div>
    </div>
  </div>

  <button id="settings-btn" title="Pengaturan API">⚙️</button>
  <script src="script.js"></script>
</body>
        </html>
