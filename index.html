<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot AI - Gemini Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div>
        <h1>🤖 As AI Pro</h1>
        <p>Upload Foto/Video/File + Auto Save</p>
      </div>
      <div class="header-btn">
        <button id="clear-btn" title="Hapus Chat">🗑️</button>
      </div>
    </header>

    <main id="chat-box" class="chat-box"></main>

    <!-- Preview file -->
    <div id="file-preview" class="file-preview"></div>

    <form id="chat-form" class="chat-input">
      <label for="file-input" class="file-btn" title="Upload Foto/Video/File">📎</label>
      <input type="file" id="file-input" accept="image/*,video/*,.pdf,.txt,.docx" hidden />

      <input type="text" id="user-input" placeholder="Ketik pesan atau upload file..." autocomplete="off" />
      <button type="submit" id="send-btn">Kirim ➤</button>
    </form>
  </div>

  <!-- Modal -->
  <div id="api-modal" class="modal">
    <div class="modal-content">
      <h2>⚙️ Pengaturan API</h2>
      <label>API Key 1 (wajib):</label>
      <input type="password" id="api-key-1" placeholder="AIza...">
      <label>API Key 2:</label>
      <input type="password" id="api-key-2" placeholder="Opsional">
      <label>API Key 3:</label>
      <input type="password" id="api-key-3" placeholder="Opsional">
      <label>Pilih Key:</label>
      <select id="api-key-select">
        <option value="0">Key 1</option>
        <option value="1">Key 2</option>
        <option value="2">Key 3</option>
        <option value="auto">🔄 Auto-Rotasi (Anti Limit)</option>
      </select>
      <label>Model:</label>
      <select id="model-select">
        <option value="gemini-3.5-flash">gemini-3.5-flash (Bisa baca foto/video)</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (Paling hemat)</option>
      </select>
      <div class="modal-actions">
        <button id="save-api-btn">💾 Simpan</button>
        <button id="close-modal-btn" class="secondary">Tutup</button>
      </div>
    </div>
  </div>

  <button id="settings-btn">⚙️</button>
  <script src="script.js"></script>
</body>
  </html>
